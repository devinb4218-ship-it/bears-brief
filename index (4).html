<script>
// ---------------- Shared constants ----------------
const TAGS = [
  { key: 'tmobile', label: 'T-Mobile', color: '#E20074' },
  { key: 'slipguard', label: 'Slip Guard Solutions', color: 'var(--proj-sgs)' },
  { key: 'inland', label: 'Inland Xpedited', color: 'var(--proj-inland)' },
  { key: 'personal', label: 'Personal', color: 'var(--tag-personal)' },
  { key: 'wife', label: 'Wife', color: 'var(--tag-wife)' },
  { key: 'kids', label: 'Kids', color: 'var(--tag-kids)' },
];
const QUADS = [
  { key: 'q1', label: 'Do First', sub: 'Urgent + Important', accent: true },
  { key: 'q2', label: 'Schedule', sub: 'Important, Not Urgent', accent: true },
  { key: 'q3', label: 'Delegate', sub: 'Urgent, Not Important', accent: false },
  { key: 'q4', label: 'Eliminate', sub: 'Not Urgent, Not Important', accent: false },
];
const PROJECT_COLORS = { SGS: 'var(--proj-sgs)', Inland: 'var(--proj-inland)', App: 'var(--proj-app)' };

function dateKey(d) { return d.toISOString().slice(0, 10); }
function formatDisplayDate(d) { return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }); }
function emptyDay() { return { q1: [], q2: [], q3: [], q4: [] }; }
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function formatTime12hr(timeStr) {
  if (!timeStr) return '';
  const [h, m] = timeStr.split(':').map(Number);
  const period = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:${String(m).padStart(2, '0')} ${period}`;
}
function daysSince(dateStr) {
  const then = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  now.setHours(0, 0, 0, 0);
  return Math.round((now - then) / 86400000);
}

// ---------------- Tab switching ----------------
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    ['today', 'business', 'projects', 'history', 'calendar'].forEach(t => {
      document.getElementById(t + '-tab').style.display = (t === btn.dataset.tab) ? 'block' : 'none';
    });
    if (btn.dataset.tab === 'business') loadBusinessTab();
    if (btn.dataset.tab === 'history') loadHistoryTab();
    if (btn.dataset.tab === 'calendar') renderCalendarTab();
  });
});

// ================= SHARED STORAGE (Supabase-backed, syncs across devices) =================
async function stateGet(key, fallback) {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/bears_brief_state?key=eq.${encodeURIComponent(key)}&select=value`, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` }
    });
    if (!res.ok) throw new Error('status ' + res.status);
    const rows = await res.json();
    return rows.length ? rows[0].value : fallback;
  } catch (e) {
    console.error('stateGet failed, using local cache', e);
    const raw = localStorage.getItem('bears-brief:cache:' + key);
    return raw ? JSON.parse(raw) : fallback;
  }
}
async function stateSet(key, value) {
  localStorage.setItem('bears-brief:cache:' + key, JSON.stringify(value));
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/bears_brief_state?on_conflict=key`, {
      method: 'POST',
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json',
        Prefer: 'resolution=merge-duplicates',
      },
      body: JSON.stringify({ key, value, updated_at: new Date().toISOString() }),
    });
  } catch (e) {
    console.error('stateSet failed, saved locally only', e);
  }
}

// ================= TODAY TAB =================
let currentDate = new Date();
let day = emptyDay();

async function loadDay() {
  day = await stateGet('day:' + dateKey(currentDate), emptyDay());
  renderToday();
}
async function saveDay() {
  await stateSet('day:' + dateKey(currentDate), day);
}
async function goToDay(offset) {
  currentDate.setDate(currentDate.getDate() + offset);
  await loadDay();
}
async function goToToday() { currentDate = new Date(); await loadDay(); }
async function jumpToDate(dateStr) {
  if (!dateStr) return;
  const [y, m, d] = dateStr.split('-').map(Number);
  currentDate = new Date(y, m - 1, d);
  await loadDay();
}
async function logCompletion(text, tag, source) {
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/bears_brief_completed_log`, {
      method: 'POST',
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ task_text: text, tag, source, completed_date: dateKey(new Date()) }),
    });
  } catch (e) {
    console.error('logCompletion failed', e);
  }
}

async function toggleDone(q, i) {
  const wasDone = day[q][i].done;
  day[q][i].done = !wasDone;
  renderToday();
  await saveDay();
  if (!wasDone) await logCompletion(day[q][i].text, day[q][i].tag, 'today');
}
async function removeTask(q, i) { day[q].splice(i, 1); renderToday(); await saveDay(); }
async function moveTask(fromQ, i, toQ) {
  if (fromQ === toQ) return;
  const t = day[fromQ].splice(i, 1)[0];
  day[toQ].push(t);
  renderToday();
  await saveDay();
}
async function loadUnscheduled() {
  return await stateGet('unscheduled', { q1: [], q2: [], q3: [], q4: [] });
}
async function saveUnscheduled(u) {
  await stateSet('unscheduled', u);
}
async function toggleUnscheduledItem(q, i) {
  const u = await loadUnscheduled();
  const wasDone = u[q][i].done;
  u[q][i].done = !wasDone;
  await saveUnscheduled(u);
  if (!wasDone) await logCompletion(u[q][i].text, u[q][i].tag, 'backlog');
  renderToday();
}

function spreadAcrossWeek(list, offset) {
  if (offset < 1 || offset > 6) return [];
  return list.filter((_, idx) => idx % 6 === offset - 1);
}

async function addTask() {
  const text = document.getElementById('new-task-text').value.trim();
  if (!text) return;
  const q = document.getElementById('new-task-quad').value;
  const tag = document.getElementById('new-task-tag').value;
  const time = document.getElementById('new-task-time').value || '';
  const noDate = document.getElementById('new-task-nodate').checked;
  const targetDateStr = document.getElementById('new-task-date').value || dateKey(currentDate);

  if (noDate) {
    const u = await loadUnscheduled();
    u[q].push({ text, tag, time, done: false });
    await saveUnscheduled(u);
  } else if (targetDateStr === dateKey(currentDate)) {
    day[q].push({ text, tag, time, done: false });
    await saveDay();
  } else {
    const targetDay = await stateGet('day:' + targetDateStr, emptyDay());
    targetDay[q].push({ text, tag, time, done: false });
    await stateSet('day:' + targetDateStr, targetDay);
  }

  document.getElementById('new-task-text').value = '';
  document.getElementById('new-task-time').value = '';
  renderToday();
}

function daysBetweenDateOnly(a, b) {
  const da = new Date(a.getFullYear(), a.getMonth(), a.getDate());
  const db = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((db - da) / 86400000);
}

// Pulls in Projects items relevant to the selected day — only SGS and Inland
// map to a life category (App-building tasks stay Projects-only, since
// "building Bears Brief" isn't one of your 6 categories):
// - viewing today: all "Do First" project items show up here too
// - viewing 1-6 days out: a slice of the "Schedule" backlog is spread across the week
function getAutoProjectItems(projects, offset) {
  const projectToCategory = { SGS: 'slipguard', Inland: 'inland' };
  const result = {};
  const source = offset === 0 ? (projects.q1 || []) : (projects.q2 || []);
  const filtered = source
    .map((t, i) => ({ ...t, projIndex: i, _quad: offset === 0 ? 'q1' : 'q2' }))
    .filter(t => !t.done && projectToCategory[t.project]);
  const finalList = offset === 0 ? filtered : spreadAcrossWeek(filtered, offset);
  finalList.forEach(t => {
    const cat = projectToCategory[t.project];
    if (!result[cat]) result[cat] = [];
    result[cat].push(t);
  });
  return result;
}

// Same idea, for your own unscheduled tasks (added with "no specific day"):
// Do First shows today only; Schedule/Delegate/Eliminate spread across the week.
// Each item already carries its own category tag from when it was added.
function getAutoUnscheduledItems(unscheduled, offset) {
  const result = {};
  const addToResult = (list) => {
    list.forEach(t => {
      if (!result[t.tag]) result[t.tag] = [];
      result[t.tag].push(t);
    });
  };
  if (offset === 0) {
    addToResult((unscheduled.q1 || []).map((t, i) => ({ ...t, uIndex: i, _quad: 'q1' })).filter(t => !t.done));
  }
  ['q2', 'q3', 'q4'].forEach(qk => {
    const list = (unscheduled[qk] || []).map((t, i) => ({ ...t, uIndex: i, _quad: qk })).filter(t => !t.done);
    addToResult(spreadAcrossWeek(list, offset));
  });
  return result;
}

async function toggleAutoProjectItem(projQuad, projIndex) {
  await toggleProject(projQuad, projIndex);
  renderToday();
}

async function renderToday() {
  const isToday = dateKey(currentDate) === dateKey(new Date());
  const offset = daysBetweenDateOnly(new Date(), currentDate);

  let html = `
    <div class="date-row">
      <button class="arrow-btn" onclick="goToDay(-1)">‹</button>
      <button class="date-center" onclick="goToToday()">
        <div class="date-text">${formatDisplayDate(currentDate)}</div>
        ${!isToday ? '<div class="today-hint">tap to jump to today</div>' : ''}
      </button>
      <button class="arrow-btn" onclick="goToDay(1)">›</button>
    </div>
    <div style="margin-bottom:18px;">
      <input type="date" id="jump-date-input" value="${dateKey(currentDate)}" onchange="jumpToDate(this.value)"
        style="width:100%;background:var(--navy-panel);border:1px solid var(--panel-line);border-radius:8px;color:var(--cream);padding:9px 10px;font-family:'Inter',sans-serif;font-size:13px;">
    </div>
  `;

  // Calendar events, tagged by source calendar (your own = personal, the
  // Outlook-subscribed one = T-Mobile), folded directly into their category
  // section below instead of a separate box.
  let eventsByCategory = {};
  if (googleToken) {
    const events = await fetchEventsForDate(currentDate);
    if (events.ok) {
      events.events.forEach(ev => {
        const cat = ev._tag || 'personal';
        if (!eventsByCategory[cat]) eventsByCategory[cat] = [];
        const time = ev.start.dateTime
          ? new Date(ev.start.dateTime).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'America/Denver' })
          : 'All day';
        eventsByCategory[cat].push({ text: ev.summary || 'Untitled event', time });
      });
    }
  }

  const projects = await loadProjects();
  const unscheduled = await loadUnscheduled();
  const autoProjectByCategory = getAutoProjectItems(projects, offset);
  const autoUnscheduledByCategory = getAutoUnscheduledItems(unscheduled, offset);

  // flatten manual (day-specific) tasks across all priority buckets, group by category
  const manualByCategory = {};
  QUADS.forEach(q => {
    (day[q.key] || []).forEach((t, i) => {
      if (!manualByCategory[t.tag]) manualByCategory[t.tag] = [];
      manualByCategory[t.tag].push({ ...t, _quad: q.key, _i: i });
    });
  });

  TAGS.forEach(cat => {
    const calEvents = eventsByCategory[cat.key] || [];
    const manual = manualByCategory[cat.key] || [];
    const autoP = autoProjectByCategory[cat.key] || [];
    const autoU = autoUnscheduledByCategory[cat.key] || [];

    if (calEvents.length === 0 && manual.length === 0 && autoP.length === 0 && autoU.length === 0) {
      html += `<div class="quad" style="border-top-color:${cat.color}">
        <div class="quad-label">${cat.label}</div>
        <div class="empty-text">Nothing here yet.</div>
      </div>`;
      return;
    }

    html += `<div class="quad" style="border-top-color:${cat.color}">
      <div class="quad-label">${cat.label}</div>`;

    calEvents.forEach(ev => {
      html += `
        <div class="task-row">
          <div class="task-body">
            <div class="task-text">${ev.time !== 'All day' ? `<strong>${esc(ev.time)}</strong> — ` : ''}${esc(ev.text)}</div>
            <span class="tag" style="background:var(--muted)">Calendar</span>
          </div>
        </div>`;
    });

    const sortedManual = manual.slice().sort((a, b) => {
      if (a.carriedFrom && !b.carriedFrom) return -1;
      if (b.carriedFrom && !a.carriedFrom) return 1;
      if (a.time && b.time) return a.time.localeCompare(b.time);
      if (a.time) return -1;
      if (b.time) return 1;
      return 0;
    });

    sortedManual.forEach(t => {
      html += `
        <div class="task-row">
          <div class="checkbox ${t.done ? 'checked' : ''}" onclick="toggleDone('${t._quad}',${t._i})"></div>
          <div class="task-body">
            <div class="task-text ${t.done ? 'done' : ''}">${t.time ? `<strong>${esc(formatTime12hr(t.time))}</strong> — ` : ''}${esc(t.text)}</div>
            ${t.carriedFrom ? `<span class="tag" style="background:var(--orange);">${daysSince(t.carriedFrom)} day${daysSince(t.carriedFrom) === 1 ? '' : 's'} overdue</span>` : ''}
          </div>
          <select onchange="moveTask('${t._quad}',${t._i},this.value)" style="background:transparent;color:var(--orange-bright);border:none;font-size:12px;">
            <option value="">priority</option>

let googleToken = null;
let tokenClient = null;

function initGoogle() {
  if (!window.google || GOOGLE_CLIENT_ID.includes('YOUR-WEB-CLIENT-ID')) return;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/gmail.readonly',
    callback: (resp) => {
      if (resp.access_token) {
        googleToken = resp.access_token;
        const expiresAt = Date.now() + (Number(resp.expires_in || 3600) * 1000);
        localStorage.setItem('bears-brief:google-token', googleToken);
        localStorage.setItem('bears-brief:google-token-expires', String(expiresAt));
        loadBusinessTab();
      }
    },
  });
  const saved = localStorage.getItem('bears-brief:google-token');
  const expiresAt = Number(localStorage.getItem('bears-brief:google-token-expires') || 0);
  if (saved && Date.now() < expiresAt) {
    googleToken = saved; // still valid, no need to sign in again
  } else {
    localStorage.removeItem('bears-brief:google-token');
    localStorage.removeItem('bears-brief:google-token-expires');
  }
}

function signInGoogle() {
  if (tokenClient) tokenClient.requestAccessToken();
}
function signOutGoogle() {
  googleToken = null;
  localStorage.removeItem('bears-brief:google-token');
  localStorage.removeItem('bears-brief:google-token-expires');
  loadBusinessTab();
}

async function fetchStageSummary(table) {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?select=stage`, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` }
    });
    if (!res.ok) throw new Error('status ' + res.status);
    const rows = await res.json();
    const counts = {};
    rows.forEach(r => { const s = r.stage || 'Unstaged'; counts[s] = (counts[s] || 0) + 1; });
    return { ok: true, counts, total: rows.length };
  } catch (e) {
    return { ok: false, error: e.message };
  }
}

let calendarListCache = null;
async function fetchCalendarList() {
  if (calendarListCache) return calendarListCache;
  try {
    const res = await fetch('https://www.googleapis.com/calendar/v3/users/me/calendarList', {
      headers: { Authorization: `Bearer ${googleToken}` }
    });
    if (!res.ok) throw new Error('status ' + res.status);
    const data = await res.json();
    calendarListCache = (data.items || []).filter(c => !c.id.includes('#holiday@'));
    return calendarListCache;
  } catch (e) {
    console.error('fetchCalendarList failed', e);
    return [];
  }
}

// Pulls events from every non-holiday calendar on the account (primary + any
// subscribed ones, like an Outlook "publish calendar" link), tagging each
// event by source: the account's own calendar -> personal, anything else
// (e.g. the Outlook subscription) -> tmobile. This is an automatic guess
// based on which calendar it came from, not a per-event manual tag.
async function fetchAllEventsForRange(startDate, endDate) {
  if (!googleToken) return { ok: false, error: 'signed_out' };
  try {
    const calendars = await fetchCalendarList();
    let allEvents = [];
    for (const cal of calendars) {
      const tag = cal.primary ? 'personal' : 'tmobile';
      const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(cal.id)}/events?timeMin=${startDate.toISOString()}&timeMax=${endDate.toISOString()}&singleEvents=true&orderBy=startTime&maxResults=250`;
      try {
        const res = await fetch(url, { headers: { Authorization: `Bearer ${googleToken}` } });
        if (!res.ok) continue;
        const data = await res.json();
        (data.items || []).forEach(ev => allEvents.push({ ...ev, _tag: tag, _calName: cal.summary }));
      } catch (e) { /* skip this calendar, keep going */ }
    }
    allEvents.sort((a, b) => {
      const at = a.start.dateTime || a.start.date;
      const bt = b.start.dateTime || b.start.date;
      return new Date(at) - new Date(bt);
    });
    return { ok: true, events: allEvents };
  } catch (e) {
    return { ok: false, error: e.message };
  }
}

async function fetchEventsForDate(dateObj) {
  const start = new Date(dateObj); start.setHours(0, 0, 0, 0);
  const end = new Date(dateObj); end.setHours(23, 59, 59, 999);
  return fetchAllEventsForRange(start, end);
}
async function fetchTodayEvents() { return fetchEventsForDate(new Date()); }

async function fetchUnreadCount() {
  if (!googleToken) return { ok: false, error: 'signed_out' };
  try {
    let count = 0;
    let pageToken = '';
    let pages = 0;
    do {
      const url = 'https://gmail.googleapis.com/gmail/v1/users/me/messages?q=' +
        encodeURIComponent('is:unread in:inbox category:primary') +
        '&maxResults=100' + (pageToken ? `&pageToken=${pageToken}` : '');
      const res = await fetch(url, { headers: { Authorization: `Bearer ${googleToken}` } });
      if (!res.ok) throw new Error('status ' + res.status);
      const data = await res.json();
      count += (data.messages || []).length;
      pageToken = data.nextPageToken || '';
      pages++;
    } while (pageToken && pages < 10); // cap at 1000 messages, plenty for an unread count
    return { ok: true, count };
  } catch (e) {
    return { ok: false, error: e.message };
  }
}

// ================= VOICE DICTATION (best-effort — iOS Safari support is known to be inconsistent) =================
let voiceRecognition = null;
let voiceListening = false;

function toggleVoiceInput() {
  const SpeechRecognitionClass = window.SpeechRecognition || window.webkitSpeechRecognition;
  const statusEl = document.getElementById('voice-status');

  if (!SpeechRecognitionClass) {
    if (statusEl) statusEl.textContent = "Voice input isn't supported in this browser.";
    return;
  }

  if (voiceListening && voiceRecognition) {
    voiceRecognition.stop();
    return;
  }

  voiceRecognition = new SpeechRecognitionClass();
  voiceRecognition.lang = 'en-US';
  voiceRecognition.continuous = false;
  voiceRecognition.interimResults = false;

  voiceRecognition.onstart = () => {
    voiceListening = true;
    if (statusEl) statusEl.textContent = 'Listening...';
    const btn = document.getElementById('voice-btn');
    if (btn) btn.style.background = 'var(--orange)';
  };

  voiceRecognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    const input = document.getElementById('new-task-text');
    if (input) input.value = transcript;
    if (statusEl) statusEl.textContent = 'Heard: "' + transcript + '" — review before adding.';
  };

  voiceRecognition.onerror = (event) => {
    if (statusEl) statusEl.textContent = 'Voice input failed (' + event.error + '). Try again or type it instead.';
  };

  voiceRecognition.onend = () => {
    voiceListening = false;
    const btn = document.getElementById('voice-btn');
    if (btn) btn.style.background = 'var(--panel-line)';
  };

  try {
    voiceRecognition.start();
  } catch (e) {
    if (statusEl) statusEl.textContent = 'Could not start voice input on this device.';
  }
}

    const map = {};

  } catch (e) {

// Builds one merged, time-sorted agenda for a single day: calendar events + your tasks
async function renderExpandedDayPanel(dateStr) {
  const [y, m, dd] = dateStr.split('-').map(Number);
  const dObj = new Date(y, m - 1, dd);
  const displayDate = dObj.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

  const [eventsResult, dayData] = await Promise.all([
    googleToken ? fetchEventsForDate(dObj) : Promise.resolve({ ok: false }),
    stateGet('day:' + dateStr, emptyDay()),
  ]);

  let items = [];
  if (eventsResult.ok) {
    eventsResult.events.forEach(ev => {
      const isAllDay = !ev.start.dateTime;
      const time = isAllDay ? '' : new Date(ev.start.dateTime).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'America/Denver' });
      items.push({ kind: 'event', text: ev.summary || 'Untitled event', time: isAllDay ? 'All day' : time, tag: ev._tag || 'personal', sortKey: isAllDay ? '00:00' : time24FromDateTime(ev.start.dateTime) });
    });
  }
  QUADS.forEach(q => {
    (dayData[q.key] || []).forEach((t, i) => {
      items.push({ kind: 'task', text: t.text, time: t.time ? formatTime12hr(t.time) : '', tag: t.tag, done: t.done, quad: q.key, index: i, sortKey: t.time || '23:59' });
    });
  });
  items.sort((a, b) => a.sortKey.localeCompare(b.sortKey));

  let html = `<div class="card" style="margin-top:10px;">
    <div class="quad-label" style="margin-bottom:10px;">${displayDate}</div>`;

  if (items.length === 0) {
    html += `<div class="empty-text">Nothing yet.</div>`;
  } else {
    items.forEach(it => {
      const tagInfo = TAGS.find(t => t.key === it.tag);
      const tagColor = tagInfo ? tagInfo.color : 'var(--muted)';
      const tagLabel = tagInfo ? tagInfo.label : (it.tag || '');
      if (it.kind === 'event') {
        html += `
          <div class="task-row">
            <div class="task-body">
              <div class="task-text">${it.time !== 'All day' ? `<strong>${esc(it.time)}</strong> — ` : ''}${esc(it.text)}</div>
              <span class="tag" style="background:${tagColor}">${esc(tagLabel)} · Calendar</span>
            </div>
          </div>`;
      } else {
        html += `
          <div class="task-row">
            <div class="checkbox ${it.done ? 'checked' : ''}" onclick="toggleCalendarDayTask('${dateStr}','${it.quad}',${it.index})"></div>
            <div class="task-body">
              <div class="task-text ${it.done ? 'done' : ''}">${it.time ? `<strong>${esc(it.time)}</strong> — ` : ''}${esc(it.text)}</div>
              <span class="tag" style="background:${tagColor}">${esc(tagLabel)}</span>
            </div>
            <button class="remove-btn" onclick="removeCalendarDayTask('${dateStr}','${it.quad}',${it.index})">×</button>
          </div>`;
      }
    });
  }

  html += `
    <div class="add-row" style="margin-top:14px;">
      <select id="cal-tag-${dateStr}">${TAGS.map(t => `<option value="${t.key}">${t.label}</option>`).join('')}</select>
      <select id="cal-quad-${dateStr}">${QUADS.map(q => `<option value="${q.key}">${q.label}</option>`).join('')}</select>
      <input type="time" id="cal-time-${dateStr}" style="max-width:110px;">
      <input type="text" id="cal-text-${dateStr}" placeholder="Add something for this day...">
      <button onclick="addCalendarDayTask('${dateStr}')">Add</button>
    </div>
  </div>`;

  return html;
}

function time24FromDateTime(dtString) {
  const d = new Date(dtString);
  const h = d.toLocaleTimeString('en-US', { hour: '2-digit', hour12: false, timeZone: 'America/Denver' });
  const m = d.toLocaleTimeString('en-US', { minute: '2-digit', timeZone: 'America/Denver' });
  return `${h.padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

function calendarViewToggle() {
  return `
    <div class="tabbar" style="padding-top:0;margin-bottom:16px;">
      <button class="tab-btn ${calendarViewMode === 'month' ? 'active' : ''}" onclick="setCalendarMode('month')">Month</button>
      <button class="tab-btn ${calendarViewMode === 'week' ? 'active' : ''}" onclick="setCalendarMode('week')">Week</button>
      <button class="tab-btn ${calendarViewMode === 'day' ? 'active' : ''}" onclick="setCalendarMode('day')">Day</button>
    </div>`;
}

async function renderCalendarTab() {
  if (calendarViewMode === 'month') return renderCalendarMonth();
  if (calendarViewMode === 'week') return renderCalendarWeek();
  return renderCalendarDay();
}

async function renderCalendarMonth() {
  const el = document.getElementById('calendar-tab');
  const year = calendarViewDate.getFullYear();
  const month = calendarViewDate.getMonth();
  const monthLabel = calendarViewDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  el.innerHTML = `<h1>Your calendar.</h1>${calendarViewToggle()}<div class="empty-text">Loading...</div>`;

  const rangeStart = new Date(year, month, 1);
  const rangeEnd = new Date(year, month + 1, 1);

  const [eventsResult, dayMap] = await Promise.all([
    fetchEventsForRange(rangeStart, rangeEnd),
    fetchMonthDaysData(year, month + 1),
  ]);

  const eventsByDate = {};
  if (eventsResult.ok) {
    eventsResult.events.forEach(ev => {
      const raw = ev.start.dateTime || ev.start.date;
      if (!raw) return;
      const key = new Date(raw).toLocaleDateString('en-CA', { timeZone: 'America/Denver' });
      if (!eventsByDate[key]) eventsByDate[key] = [];
      const time = ev.start.dateTime
        ? new Date(ev.start.dateTime).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'America/Denver' })
        : '';
      eventsByDate[key].push((time ? time + ' ' : '') + (ev.summary || 'Untitled'));
    });
  }

  const firstWeekday = rangeStart.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = dateKey(new Date());
  const weekdayLabels = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  let html = `<h1>Your calendar.</h1>${calendarViewToggle()}
    <div class="cal-header">
      <button class="arrow-btn" onclick="goToCalendarMonth(-1)">‹</button>
      <div class="cal-month-label">${monthLabel}</div>
      <button class="arrow-btn" onclick="goToCalendarMonth(1)">›</button>
    </div>
    <div class="cal-weekdays">${weekdayLabels.map(w => `<div class="cal-weekday">${w}</div>`).join('')}</div>
    <div class="cal-grid">`;

  for (let i = 0; i < firstWeekday; i++) html += `<div class="cal-cell empty"></div>`;

  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const isToday = dateStr === todayStr;
    const dayEvents = eventsByDate[dateStr] || [];
    const dayData = dayMap[dateStr];
    let openTaskCount = 0;
    if (dayData) QUADS.forEach(q => { openTaskCount += (dayData[q.key] || []).filter(t => !t.done).length; });

    const items = [];
    dayEvents.slice(0, 2).forEach(ev => items.push(`<div class="cal-item cal-event">${esc(ev)}</div>`));
    const remainingSlots = 2 - Math.min(dayEvents.length, 2);
    if (remainingSlots > 0 && openTaskCount > 0) items.push(`<div class="cal-item">${openTaskCount} task${openTaskCount === 1 ? '' : 's'}</div>`);
    const moreCount = Math.max(0, dayEvents.length - 2);

    html += `
      <div class="cal-cell ${isToday ? 'is-today' : ''}" onclick="toggleExpandedDate('${dateStr}')">
        <div class="cal-daynum">${day}</div>
        ${items.join('')}
        ${moreCount > 0 ? `<div class="cal-more">+${moreCount} more</div>` : ''}
      </div>`;
  }
  html += `</div>`;

  if (!googleToken) html += `<div class="empty-text" style="margin-top:14px;">Sign in with Google on the CRM tab to see calendar events here too.</div>`;

  el.innerHTML = html;

  if (calendarExpandedDate) {
    const panel = await renderExpandedDayPanel(calendarExpandedDate);
    document.getElementById('calendar-tab').innerHTML += panel;
  }
}

async function renderCalendarWeek() {
  const el = document.getElementById('calendar-tab');
  el.innerHTML = `<h1>Your calendar.</h1>${calendarViewToggle()}<div class="empty-text">Loading...</div>`;

  const start = new Date(calendarViewDate);
  start.setDate(start.getDate() - start.getDay()); // back to Sunday
  const end = new Date(start);
  end.setDate(end.getDate() + 7);

  const weekLabel = `${start.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} – ${new Date(end - 1).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}`;
  const [eventsResult, dayMap] = await Promise.all([
    fetchEventsForRange(start, end),
    fetchMonthDaysData(start.getFullYear(), start.getMonth() + 1),
  ]);

  const eventsByDate = {};
  if (eventsResult.ok) {
    eventsResult.events.forEach(ev => {
      const raw = ev.start.dateTime || ev.start.date;
      if (!raw) return;
      const key = new Date(raw).toLocaleDateString('en-CA', { timeZone: 'America/Denver' });
      if (!eventsByDate[key]) eventsByDate[key] = [];
      const time = ev.start.dateTime
        ? new Date(ev.start.dateTime).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'America/Denver' })
        : 'All day';
      eventsByDate[key].push(`${time} ${ev.summary || 'Untitled'}`);
    });
  }

  const todayStr = dateKey(new Date());
  let html = `<h1>Your calendar.</h1>${calendarViewToggle()}
    <div class="cal-header">
      <button class="arrow-btn" onclick="goToCalendarWeek(-1)">‹</button>
      <div class="cal-month-label">${weekLabel}</div>
      <button class="arrow-btn" onclick="goToCalendarWeek(1)">›</button>
    </div>
    <div class="cal-grid" style="grid-template-columns:repeat(7,1fr);">`;

  for (let i = 0; i < 7; i++) {
    const d = new Date(start);
    d.setDate(d.getDate() + i);
    const dateStr = dateKey(d);
    const isToday = dateStr === todayStr;
    const dayEvents = eventsByDate[dateStr] || [];
    const dayData = dayMap[dateStr];
    let openTasks = [];
    if (dayData) QUADS.forEach(q => (dayData[q.key] || []).forEach(t => { if (!t.done) openTasks.push(t.text); }));

    html += `
      <div class="cal-cell ${isToday ? 'is-today' : ''}" style="min-height:130px;" onclick="toggleExpandedDate('${dateStr}')">
        <div class="cal-daynum">${d.toLocaleDateString('en-US', { weekday: 'short' })} ${d.getDate()}</div>
        ${dayEvents.map(ev => `<div class="cal-item cal-event">${esc(ev)}</div>`).join('')}
        ${openTasks.map(t => `<div class="cal-item">${esc(t)}</div>`).join('')}
      </div>`;
  }
  html += `</div>`;

  if (!googleToken) html += `<div class="empty-text" style="margin-top:14px;">Sign in with Google on the CRM tab to see calendar events here too.</div>`;

  el.innerHTML = html;

  if (calendarExpandedDate) {
    const panel = await renderExpandedDayPanel(calendarExpandedDate);
    document.getElementById('calendar-tab').innerHTML += panel;
  }
}

async function renderCalendarDay() {
  const el = document.getElementById('calendar-tab');
  const dateStr = dateKey(calendarViewDate);
  const displayDate = calendarViewDate.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

  el.innerHTML = `<h1>Your calendar.</h1>${calendarViewToggle()}
    <div class="cal-header">
      <button class="arrow-btn" onclick="goToCalendarDay(-1)">‹</button>
      <div class="cal-month-label">${displayDate}</div>
      <button class="arrow-btn" onclick="goToCalendarDay(1)">›</button>
    </div>
    <div class="empty-text">Loading...</div>`;

  const panel = await renderExpandedDayPanel(dateStr);
  el.innerHTML = `<h1>Your calendar.</h1>${calendarViewToggle()}
    <div class="cal-header">
      <button class="arrow-btn" onclick="goToCalendarDay(-1)">‹</button>
      <div class="cal-month-label">${displayDate}</div>
      <button class="arrow-btn" onclick="goToCalendarDay(1)">›</button>
    </div>
    ${panel}`;
}

// ================= CARRY-OVER: unfinished tasks roll forward to today =================
async function runCarryOverIfNeeded() {
  const todayStr = dateKey(new Date());
  if (localStorage.getItem('bears-brief:carryover-last-run') === todayStr) return;

  const rolled = emptyDay();
  const maxLookbackDays = 14;

  for (let i = 1; i <= maxLookbackDays; i++) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const key = dateKey(d);
    let dayData;
    try {
      dayData = await stateGet('day:' + key, null);
    } catch (e) { continue; }
    if (!dayData) continue;

    let changed = false;
    QUADS.forEach(q => {
      const remaining = [];
      (dayData[q.key] || []).forEach(t => {
        if (!t.done) {
          rolled[q.key].push({ ...t, carriedFrom: t.carriedFrom || key });
          changed = true;
        } else {
          remaining.push(t);
        }
      });
      dayData[q.key] = remaining;
    });
    if (changed) await stateSet('day:' + key, dayData);
  }

  const hasAny = QUADS.some(q => rolled[q.key].length > 0);
  if (hasAny) {
    const todayData = await stateGet('day:' + todayStr, emptyDay());
    QUADS.forEach(q => { todayData[q.key] = [...(todayData[q.key] || []), ...rolled[q.key]]; });
    await stateSet('day:' + todayStr, todayData);
  }

  localStorage.setItem('bears-brief:carryover-last-run', todayStr);
}
